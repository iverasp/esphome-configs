esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -10
    then:
      - light.turn_on:
          id: backlight
          brightness: 100%

esp32:
  variant: ESP32P4
  flash_size: 16MB
  flash_mode: dio
  engineering_sample: false
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_LV_DRAW_SW_SUPPORT_RGB565: "y"
    advanced:
      enable_idf_experimental_features: true

esp32_hosted:
  variant: esp32c6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true

psram:
  mode: hex
  speed: 100MHz

logger:
  hardware_uart: UART0

# DSI PHY power rail.
esp_ldo:
  - channel: 3
    voltage: 2.5V

i2c:
  - id: i2c_bus_a
    sda: GPIO7
    scl: GPIO8
    scan: true
    frequency: 400kHz
    sda_pullup_enabled: false
    scl_pullup_enabled: false

output:
  - platform: ledc
    id: backlight_output
    pin: GPIO23

light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    icon: mdi:television
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

display:
  - platform: mipi_dsi
    model: JC8012P4A1-V2
    id: tft_display
    reset_pin: GPIO27
    auto_clear_enabled: false
    color_order: RGB
    update_interval: never
    dimensions:
      width: 800
      height: 1280

touchscreen:
  - platform: gsl3670
    model: GUITION-JC8012P4A1
    id: tft_touch
    i2c_id: i2c_bus_a
    display: tft_display
