esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  platformio_options:
    custom_versions.beken-bdk: 3.0.78

bk72xx:
  board: generic-bk7238-tuya # use this if you have a Tuya device, remove "-tuya" suffix if you don't (unlikely)
  family: BK7231N # workaround for ESPHome not knowing what a BK7238 is, doesn't cause any problems
  framework: 
    version: 0.0.0
    source: https://github.com/libretiny-eu/libretiny#feature/bk7238

deep_sleep:
  sleep_duration: 12h
  run_duration: 60s
  wakeup_pin:
    - pin:
        number: P15
        allow_other_uses: true
        inverted: true
      wakeup_pin_mode: INVERT_WAKEUP
    - pin:
        number: P21
        allow_other_uses: true
        inverted: true
      wakeup_pin_mode: INVERT_WAKEUP

# ── Outputs ────────────────────────────────────────────────────────────────────

output:
  - platform: gpio
    id: red_led_output
    pin:
      number: P17
      inverted: false

# ── Status LED — flashes while running, solid on smoke ─────────────────────────

light:
  - platform: binary
    id: red_led
    output: red_led_output
    name: "Status LED"
    internal: true        # don't expose to HA directly; controlled by automations

interval:
  - interval: 10000ms
    id: heartbeat_flash
    then:
      - if:
          condition:
            binary_sensor.is_off: smoke_detected
          then:
            - output.turn_on: red_led_output
            - delay: 100ms
            - output.turn_off: red_led_output

# ── Smoke sensor ───────────────────────────────────────────────────────────────

binary_sensor:
  - platform: gpio
    name: "Smoke Detected"
    id: smoke_detected
    pin:
      number: P15        # pin 21
      mode: INPUT
      allow_other_uses: true
    device_class: smoke
    on_press:
      then:
        # Cancel heartbeat flash, hold LED solid
        - output.turn_on: red_led_output
    on_release:
      then:
        # Smoke cleared — heartbeat loop will resume naturally
        - output.turn_off: red_led_output

# ── Tamper switch ─────────────────────────────────────────────────────────────

  - platform: gpio
    name: "Tamper"
    id: tamper_switch
    pin:
      number: P21         # pin 19
      mode: INPUT
      allow_other_uses: true
      inverted: true
    device_class: tamper
    # Wakes device on deep-sleep platforms; on always-on WiFi devices this
    # simply reports the state change immediately.
    # wakeup_pin: true

